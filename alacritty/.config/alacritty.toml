[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = '#000000'
foreground = '#c5c9c5'

[colors.normal]
black = '#0d0c0c'
blue = '#8ba4b0'
cyan = '#8ea4a2'
green = '#8a9a7b'
magenta = '#a292a3'
red = '#c4746e'
white = '#c8c093'
yellow = '#c4b28a'

[colors.bright]
black = '#a6a69c'
blue = '#7fb4ca'
cyan = '#7aa89f'
green = '#87a987'
magenta = '#938aa9'
red = '#e46876'
white = '#c5c9c5'
yellow = '#e6c384'

[colors.selection]
background = '#2d4f67'
foreground = '#c8c093'

[[colors.indexed_colors]]
index = 16
color = '#ffa066'

[[colors.indexed_colors]]
index = 17
color = '#ff5d62'

[cursor.style]
shape = "Block"
blinking = "Never"

[cursor]
vi_mode_style = "Block"

[env]
TERM = "xterm-256color"

[window]
dynamic_padding = false
opacity = 0.8

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.padding]
x = 0
y = 0

[scrolling]
history = 5000

[selection]
save_to_clipboard = true

[font]
size = 9

[font.normal]
family = "FiraCode Nerd Font Mono"
style = "Medium"

[font.bold]
family = "FiraCode Nerd Font Mono"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "FiraCode Nerd Font Mono"
style = "Bold Italic"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

[mouse]
hide_when_typing = true

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Option"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Option"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Option"

[[keyboard.bindings]]
action = "ClearLogNotice"
key = "L"
mods = "Option"

[[keyboard.bindings]]
chars = "\f"
key = "L"
mods = "Option"

[general]
live_config_reload = true
